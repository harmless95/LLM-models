[tool.poetry]
package-mode=false

[tool.poetry.dependencies]
python=">=3.12.1,<3.15"
transformers = "^4.57.1"
torch = {version = "2.6.0+cu118", source = "pytorch"}
torchvision = {version = "0.21.0+cu118", source = "pytorch"}
torchaudio = {version = "2.6.0+cu118", source = "pytorch"}


[dependency-groups]
dev = [
    "black (>=25.9.0,<26.0.0)"
]

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu118"
priority = "explicit"