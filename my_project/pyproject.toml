[tool.poetry]
package-mode=false

[tool.poetry.dependencies]
python=">=3.12.1,<3.15"
transformers = "^4.57.1"
torch = {version = "2.7.1+cu128", source = "pytorch"}
torchvision = {version = "0.22.1+cu128", source = "pytorch"}
torchaudio = {version = "2.7.1+cu128", source = "pytorch"}
datasets = "^4.3.0"
accelerate = ">=0.26.0"
evaluate = "^0.4.6"
scikit-learn = "^1.7.2"
scipy = "^1.16.3"
sentencepiece = "^0.2.1"
sacremoses = "^0.1.1"


[dependency-groups]
dev = [
    "black (>=25.9.0,<26.0.0)"
]

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"